<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Art Gallery</title>

    <script type="module" src="/src/main.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap"
        rel="stylesheet" />
</head>

<body>
    <div class="title">
        <h1>Art Gallery</h1>
        <button class="theme__toggle">Theme</button>
    </div>

    <div class="controls">
        <div class="filterSelect">
            <button class="filter__buttons">All</button>
            <button class="filter__buttons">Impressionism</button>
            <button class="filter__buttons">Post-Impressionism</button>
            <button class="filter__buttons">Japanese Prints</button>
            <button class="filter__buttons">American Realism</button>
            <button class="filter__buttons">Night Scenes</button>
            <button class="filter__buttons">Cityscapes</button>
            <button class="filter__buttons">Seascapes & Water</button>
            <button class="filter__buttons">Landscapes</button>
        </div>
    </div>
    <h2>Art of the Day</h2>
        <div class="artofDay__container">
            <img id="artofDayImg">
        </div>
    <div class="container">

    

    </div>

    <div class="upload__section">
        <h2>Upload Image</h2>
        <form id="uploadForm">
            <input type="file" name="image" required />
            <input type="text" id="uploadName" placeholder="Name" required />
            <input type="text" id="uploadArtist" placeholder="Artist" required />
            <input type="text" id="uploadYear" placeholder="Year" required />
            <button type="submit">Upload</button>
        </form>
    </div>

    <div id="modal" class="modal">
        <div class="modal__content">
            <img id="modalImg" />
            <h2 id="modalName"></h2>
            <h3 id="modalArtist"></h3>
            <p id="modalYear"></p>
        </div>
    </div>

</body>

</html>
