<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Art Gallery</title>

    <script type="module" src="/src/main.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="controls">
        <div class="filterSelect">
            <button class="filter__buttons">All</button>
            <button class="filter__buttons">Impressionism</button>
            <button class="filter__buttons">Post-Impressionism</button>
            <button class="filter__buttons">Japanese Prints</button>
            <button class="filter__buttons">American Realism</button>
            <button class="filter__buttons">Night Scenes</button>
            <button class="filter__buttons">Cityscapes</button>
            <button class="filter__buttons">Seascapes & Water</button>
            <button class="filter__buttons">Landscapes</button>
        </div>
    </div>

    <div class="title">
        <h1>Art Gallery</h1>
        <button class="theme__toggle">Dark Mode / Light Mode</button>
    </div>

    <div class="artofDay_text">
        <h4>Art of the Day</h4>
    </div>

    <div class="artofDay__container">
        <img id="artofDayImg">
    </div>

    <div>
        <h5>Collection</h5>
    </div>

    <div class="container"></div>

    <div class="upload__section">
        <h2>Upload Image</h2>
        <form id="uploadForm">
            <input type="file" name="image" required />
            <input type="text" id="uploadName" placeholder="Name" required />
            <input type="text" id="uploadArtist" placeholder="Artist" required />
            <input type="text" id="uploadYear" placeholder="Year" required />
            <button type="submit">Upload</button>
        </form>
    </div>

    <div id="modal" class="modal">
        <div class="modal__content">
            <img id="modalImg" />
            <h2 id="modalName"></h2>
            <h3 id="modalArtist"></h3>
            <p id="modalYear"></p>
        </div>
    </div>

</body>

</html>
